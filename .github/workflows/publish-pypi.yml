name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Target repository"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Verify release tag matches package version
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 -c "
          import ast, os, sys
          event = os.environ.get('EVENT_NAME', '')
          if event == 'release':
              tag = os.environ.get('RELEASE_TAG', '').lstrip('v')
          else:
              ref_type = os.environ.get('REF_TYPE', '')
              if ref_type != 'tag':
                  sys.exit(f'Manual dispatch to production PyPI requires dispatching from a git tag, got ref_type={ref_type!r}')
              tag = os.environ.get('REF_NAME', '').lstrip('v')

          if not tag:
              sys.exit('No release tag specified for production PyPI release')

          tree = ast.parse(open('src/docx/__init__.py', 'r', encoding='utf-8').read())
          version = None
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == '__version__':
                          if isinstance(node.value, ast.Constant):
                              version = node.value.value
                          elif hasattr(node.value, 's'):
                              version = node.value.s
                          break
          if not version:
              sys.exit('Could not find __version__ in src/docx/__init__.py')

          if tag != version:
              sys.exit(f'Release tag mismatch: tag={tag} vs __version__={version}')
          print(f'Release tag matches package version: {version}')
          "

      - name: Install build tools and test dependencies
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install --editable . --requirement requirements-test.txt

      - name: Run unit and integration tests
        run: python -m pytest -q

      - name: Run acceptance tests
        run: python -m behave --format progress --stop --tags=-wip

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package distribution metadata
        run: python -m twine check --strict dist/*

      - name: Install and verify distribution
        run: |
          python -m pip install --force-reinstall dist/python_docx_oss-*-py3-none-any.whl
          package_version="$(python -c 'import docx; print(docx.__version__)')"
          echo "Verified package install: docx.__version__=${package_version}"

      - name: Store distribution packages
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/python-docx-oss
    permissions:
      id-token: write
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: (github.event_name == 'release' && github.event.action == 'published' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/python-docx-oss
    permissions:
      id-token: write
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
